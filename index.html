<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Speaking Coach</title>
<meta name="theme-color" content="#1f1e1c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/app.css?v=20261123">
</head>
<body>
<div id="app">
  <aside class="nav">
    <div class="brand">Speaking Coach</div>
    <button class="tab" data-view="today"><span class="ic">📅</span>Today</button>
    <button class="tab" data-view="progress"><span class="ic">📈</span>Progress</button>
    <button class="tab" data-view="skills"><span class="ic">🎯</span>Skills</button>
    <button class="tab" data-view="badges"><span class="ic">🏅</span>Badges</button>
    <button class="tab" data-view="settings" style="margin-top:auto"><span class="ic">⚙️</span>Settings</button>
  </aside>
  <main>
    <div class="topbar">
      <h1 id="title">Today</h1>
      <span class="pill" id="sync">…</span>
      <button class="iconbtn" id="refresh" aria-label="Refresh">⟳</button>
      <button class="iconbtn" id="gear" aria-label="Settings">⚙️</button>
    </div>
    <div id="sample-banner" class="sample-banner" hidden>You're looking at sample data. Connect your data in Settings to see your own.</div>
    <section class="view" id="view-today" hidden></section>
    <section class="view" id="view-progress" hidden></section>
    <section class="view" id="view-skills" hidden></section>
    <section class="view" id="view-badges" hidden></section>
    <section class="view" id="view-settings" hidden></section>
  </main>
  <nav class="tabbar">
    <button class="tab" data-view="today"><span class="ic">📅</span>Today</button>
    <button class="tab" data-view="progress"><span class="ic">📈</span>Progress</button>
    <button class="tab" data-view="skills"><span class="ic">🎯</span>Skills</button>
    <button class="tab" data-view="badges"><span class="ic">🏅</span>Badges</button>
  </nav>
</div>
<div class="runner" id="runner" hidden><div class="inner" id="runner-inner"></div></div>
<div id="toast" role="status"></div>
<script type="module" src="js/app.js?v=20261123"></script>
</body>
</html>
